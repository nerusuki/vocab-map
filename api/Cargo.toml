[package]
name = "actix-api"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-cors = "0.7.1"
actix-web = "4"
diesel = {version = "2.2.7", features=["postgres"]}
diesel-derive-enum = { version = "3.0.0-beta.1", features = ["postgres"] }
dotenvy = "0.15.7"
hmac = "0.12.1"
jwt = "0.16.0"
linfa = "0.8.0"
linfa-tsne = "0.8.0"
ndarray = "0.16.1"
pgvector = { version = "0.4", features = ["diesel"] }
serde = { version = "1.0.227", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
