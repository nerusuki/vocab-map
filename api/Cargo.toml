[package]
name = "vocab_map_api"
version = "0.1.0"
edition = "2024"

[features]
generate = ["dep:fastembed"]

[dependencies]
actix-cors = "0.7.1"
actix-web = "4"
diesel = { version = "2.2.7", features = ["postgres"] }
diesel-async = { version = "0.9.2", features = ["deadpool", "postgres"] }
diesel-derive-enum = { version = "3.0.0-beta.1", features = ["postgres"] }
dotenvy = "0.15.7"
hmac = "0.12.1"
jwt = "0.16.0"
argon2 = { version = "0.5", features = ["std"] }
pgvector = { version = "0.4", features = ["diesel"] }
serde = { version = "1.0.227", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tokio = "1.54.1"
futures = "0.3.34"
fastembed = { version = "7.5.0", optional = true }
bhtsne = "0.7.13"
